# Local development stack. Secrets left empty fall back to the throwaway
# values in settings/dev.py; host ports are bound to 127.0.0.1 only.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-notify_relay.settings.dev}
  DEBUG: ${DEBUG:-1}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  SECRET_KEY: ${SECRET_KEY:-}
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
  API_KEY_HASH_PEPPER: ${API_KEY_HASH_PEPPER:-}
  WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
  DATABASE_URL: postgres://nr:nr@db:5432/notify_relay
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_TLS: ${SMTP_TLS:-0}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@notify-relay.internal}
  WEBHOOK_TIMEOUT_S: ${WEBHOOK_TIMEOUT_S:-10}
  WEBHOOK_BLOCKED_NETWORKS: ${WEBHOOK_BLOCKED_NETWORKS:-}
  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-1}
  RATE_LIMIT_DEFAULT_PER_MIN: ${RATE_LIMIT_DEFAULT_PER_MIN:-100}
  RATE_LIMIT_DEFAULT_BURST: ${RATE_LIMIT_DEFAULT_BURST:-200}
  RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-10}
  RATE_LIMIT_AUTH_BURST: ${RATE_LIMIT_AUTH_BURST:-10}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}

x-worker-env: &worker-env
  <<: *app-env
  CELERY_METRICS_PORT: "9100"
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus

x-app-build: &app-build
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: notify-relay:dev
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app-build
    command: ["api"]
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker-high:
    <<: *app-build
    command: ["worker", "high"]
    environment:
      <<: *worker-env
      CELERY_CONCURRENCY: "8"

  worker-default:
    <<: *app-build
    command: ["worker", "default"]
    environment:
      <<: *worker-env
      CELERY_CONCURRENCY: "4"

  worker-low:
    <<: *app-build
    command: ["worker", "low"]
    environment:
      <<: *worker-env
      CELERY_CONCURRENCY: "2"

  beat:
    <<: *app-build
    command: ["beat"]
    environment:
      <<: *app-env

  db:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nr
      POSTGRES_PASSWORD: nr
      POSTGRES_DB: notify_relay
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nr -d notify_relay"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8025/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
